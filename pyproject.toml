[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tic-bench"
version = "0.1.0"
description = "Sanitized TIC-Bench inference and evaluation toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.68",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ticbench = "ticbench.cli:main"

[tool.setuptools.packages.find]
include = ["ticbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
